name: Build APK

on:
  push:
    branches: [ main, master, claude/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write  # needed for the Create Release step (fixes 403)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Release builds use the AOT engine and drop the debug JIT snapshots,
      # and --split-per-abi emits one APK per architecture instead of bundling
      # all of them. Together these take the download from ~120 MB to ~20 MB.
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: accounting-app
          path: build/app/outputs/flutter-apk/*-release.apk

      # Chrome on Android refuses downloads served as
      # application/vnd.android.package-archive: it fetches the whole file and
      # then discards it. A .zip copy is not special-cased, so it downloads
      # normally and can be extracted on the phone.
      - name: Zip APKs for browsers that block .apk downloads
        run: |
          cd build/app/outputs/flutter-apk
          for apk in *-release.apk; do
            zip -j "${apk}.zip" "$apk"
          done
          ls -lh *.zip

      - name: Create Release
        continue-on-error: true   # never fail the build over a publish hiccup
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Install **app-arm64-v8a-release.apk** on any phone from roughly 2017
            onwards. Use app-armeabi-v7a-release.apk only for older 32-bit
            devices; the x86_64 build is for emulators.

            If your browser refuses the .apk download — Chrome on Android
            fetches it fully and then discards it — grab the matching **.zip**
            instead and extract it on the phone.

            These are signed with a build-generated debug key, so uninstall any
            previous copy before installing.
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/*-release.apk.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Build trigger: bank statement OCR validation
